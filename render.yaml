services:
  - type: web
    name: chatkaro-backend
    env: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: chatkaro-data
      mountPath: /app/data
      sizeGB: 1
